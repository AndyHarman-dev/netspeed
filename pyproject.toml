[project]
name = "netspeed"
dynamic = ["version"]
description = "Measure download speed by fetching a URL repeatedly."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["httpx>=0.27"]

[project.scripts]
netspeed = "netspeed.cli:main"

[dependency-groups]
dev = [
    "coverage>=7.16.2",
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/netspeed/__init__.py"

[tool.pytest.ini_options]
testpaths = ["tests/unit"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
